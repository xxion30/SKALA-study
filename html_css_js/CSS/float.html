<!DOCTYPE html>
<html>
<head>
<style>
img {
  width: 170px;
  /* float and margin - 어디에 위치시킬건지, 마진을 얼마나 줄지 */ 
  float: left;
  margin-right: 15px;
}

footer {
  background-color: lightgray;
  padding: 10px;
  /* clear the float */
  clear: both;
}
</style>
</head>
<body>

<h1>Float and Clear</h1>
<img src="pineapple.jpg" alt="Pineapple">
<p>The float property places an element to the left or right, allowing text to wrap around it. The clear property controls what happens next to floated elements.</p>

<footer>Footer - should appear below the image.</footer>

</body>
</html>
